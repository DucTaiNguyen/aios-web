<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AIOS Mission Control</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="topbar">
  🛰 AIOS MISSION CONTROL
  <span class="live">● LIVE</span>
</div>

<div class="grid">

  <!-- LEFT -->
  <div class="panel">
    <h2>🧠 CORE SYSTEM</h2>

    <pre id="out">Loading...</pre>

    <button onclick="run()">RUN STEP</button>
    <button onclick="toggleAuto()">AUTO MODE</button>
  </div>

  <!-- CENTER -->
  <div class="panel">
    <h2>📊 SIGNAL FLOW</h2>
    <canvas id="chart"></canvas>

    <h3>LIVE METRICS</h3>
    <div>Energy: <span id="energy">0</span></div>
    <div>Awareness: <span id="awareness">0</span></div>
    <div>Time: <span id="time">0</span></div>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <h2>📡 LOG SYSTEM</h2>
    <div id="log"></div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
